<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>逗號分隔 ⇄ Excel儲存格互轉工具</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}
:root{
    --primary:#2563eb;
    --primary-light:#3b82f6;
    --gray-100:#f3f4f6;
    --gray-200:#e5e7eb;
    --gray-600:#4b5563;
    --gray-800:#1f2937;
    --white:#ffffff;
    --radius:10px;
}
body{
    font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;
    background-color:#f0f4f9;
    padding:20px 16px;
    color:var(--gray-800);
}
.container{
    max-width:860px;
    margin:0 auto;
}
h1{
    text-align:center;
    font-size:24px;
    margin-bottom:24px;
    color:var(--gray-800);
}
.card{
    background:var(--white);
    border-radius:var(--radius);
    padding:20px;
    box-shadow:0 2px 12px rgba(0,0,0,0.08);
    margin-bottom:16px;
}
.title-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
}
.card h2{
    font-size:17px;
    font-weight:600;
}
textarea{
    width:100%;
    min-height:160px;
    border:1px solid var(--gray-200);
    border-radius:8px;
    padding:12px;
    font-size:15px;
    line-height:1.55;
    resize:vertical;
    background:var(--gray-100);
}
textarea:focus{
    outline:none;
    border-color:var(--primary);
    background:#fff;
}
.btn-row{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-top:14px;
}
button{
    padding:10px 18px;
    border-radius:8px;
    border:none;
    font-size:15px;
    font-weight:500;
    cursor:pointer;
    transition:0.18s ease;
}
.btn-primary{
    background:var(--primary);
    color:#fff;
}
.btn-primary:hover{
    background:var(--primary-light);
}
.btn-gray{
    background:var(--gray-200);
    color:var(--gray-800);
}
.btn-gray:hover{
    background:#d1d5db;
}
/* 轉換模式切換區 */
.mode-wrap{
    text-align:center;
    margin-bottom:20px;
}
.mode-btn{
    padding:12px 22px;
    margin:0 6px 8px 6px;
}
.mode-active{
    background-color:var(--primary);
    color:white;
}
.tip{
    font-size:14px;
    color:var(--gray-600);
    margin-top:8px;
}
/* Toast通知 */
.toast{
    position:fixed;
    left:50%;
    bottom:30px;
    transform:translateX(-50%);
    background:#222;
    color:white;
    padding:10px 22px;
    border-radius:8px;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.25s;
}
.toast.show{
    opacity:1;
}
</style>
</head>
<body>
<div class="container">
    <h1>逗號資料 ⇄ Excel儲存格互轉工具</h1>

    <div class="card">
        <div class="mode-wrap">
            <button id="mode3" class="mode-btn mode-active">模式C：Excel多格→逗號+補序號+字段重排</button>
            <button id="mode2" class="mode-btn btn-gray">模式B：Excel多格 → 逗號格式</button>
            <button id="mode1" class="mode-btn btn-gray">模式A：逗號 → Excel多格（Tab分隔）</button>
        </div>
        <div class="title-row">
            <h2>輸入區</h2>
        </div>
        <textarea id="inputArea" placeholder="貼入Excel多格範例：
2026/8/31	MP	W101	S05	548.0B908.0011	B2026082600593	V10000551110	DGX	18
2026/9/1	MP	W102	S06	548.0B908.0012	B2026082600594	V10000551111	DGX	19"></textarea>
        <div class="btn-row">
            <button class="btn-primary" onclick="convert()">開始轉換</button>
            <button class="btn-gray" onclick="clearAll()">清空全部</button>
        </div>
    </div>

    <div class="card">
        <div class="title-row">
            <h2>輸出結果</h2>
            <button class="btn-primary" onclick="copyResult()">一鍵複製結果</button>
        </div>
        <textarea id="outputArea" readonly placeholder="轉換後內容會顯示於此..."></textarea>
        <div class="tip" id="tipText">模式C：自動補流水號、日期去年份、重排字段、互換最後兩欄</div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
const inputDom = document.getElementById('inputArea');
const outputDom = document.getElementById('outputArea');
const toastDom = document.getElementById('toast');
const tipTextDom = document.getElementById('tipText');

let currentMode = 3;

// 模式切換
document.getElementById('mode3').onclick = ()=>{
    currentMode=3;
    document.getElementById('mode3').classList.add('mode-active');
    document.getElementById('mode2').classList.remove('mode-active');
    document.getElementById('mode1').classList.remove('mode-active');
    tipTextDom.innerText = '模式C：自動補流水號、日期去年份、重排字段、互換最後兩欄';
}
document.getElementById('mode2').onclick = ()=>{
    currentMode=2;
    document.getElementById('mode2').classList.add('mode-active');
    document.getElementById('mode3').classList.remove('mode-active');
    document.getElementById('mode1').classList.remove('mode-active');
    tipTextDom.innerText = '模式B：Excel貼上進來，輸出標準逗號分隔文字';
}
document.getElementById('mode1').onclick = ()=>{
    currentMode=1;
    document.getElementById('mode1').classList.add('mode-active');
    document.getElementById('mode3').classList.remove('mode-active');
    document.getElementById('mode2').classList.remove('mode-active');
    tipTextDom.innerText = '模式A：逗號轉Tab，複製直接貼Excel自動拆分儲存格';
}

function showToast(text){
    toastDom.innerText = text;
    toastDom.classList.add('show');
    setTimeout(()=>toastDom.classList.remove('show'),1600);
}

function convert(){
    const raw = inputDom.value.trim();
    if(!raw){
        showToast('請輸入資料');
        return;
    }
    const lines = raw.split(/\r?\n/);
    const resultArr = [];
    let lineNo = 1; //流水號從1開始

    lines.forEach(line=>{
        const str = line.trim();
        if(!str) return;

        if(currentMode === 3){
            // 步驟1：Excel Tab轉陣列
            let cells = str.split('\t').map(item=>item.trim());
            // 步驟2：開頭補流水號，變成完整9欄結構
            let fullCells = [lineNo.toString(), ...cells];
            // 步驟3：處理日期去掉年份
            let dateVal = fullCells[1] || '';
            if(dateVal.includes('/')){
                const dateParts = dateVal.split('/');
                if(dateParts.length >=2){
                    dateVal = dateParts.slice(1).join('/');
                }
            }
            // 步驟4：字段重排，最後兩欄互換
            const order = [0,2,3,1,4,7,8,9,5];
            const newCells = order.map(i=>{
                if(i === 1) return dateVal;
                return fullCells[i] || '';
            });
            resultArr.push(newCells.join(','));
            lineNo++;
        }else if(currentMode === 2){
            const tabCells = str.split('\t');
            resultArr.push(tabCells.join(','));
        }else if(currentMode === 1){
            const cells = str.split(',').map(item=>item.trim());
            resultArr.push(cells.join('\t'));
        }
    })
    outputDom.value = resultArr.join('\n');
    showToast('轉換完成！');
}

function copyResult(){
    if(!outputDom.value){
        showToast('沒有可複製內容');
        return;
    }
    navigator.clipboard.writeText(outputDom.value).then(()=>{
        showToast('複製成功，可貼上Excel');
    })
}

function clearAll(){
    inputDom.value='';
    outputDom.value='';
}
</script>
</body>
</html>
