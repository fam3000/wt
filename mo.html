<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>A4直式 2×2 A6工單列印工具</title>
<style>
/* 全域基礎樣式 */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
body {
    font-family: "Noto Sans TC", SimSun, -apple-system, BlinkMacSystemFont, sans-serif;
    background-color: #eeeeee;
    padding: 20px;
}

/* 控制面板(螢幕顯示，列印隱藏) */
.control-panel {
    max-width: 900px;
    margin: 0 auto 30px;
    padding: 16px;
    background: #ffffff;
    border-radius: 10px;
    box-shadow: 0 2px 8px #00000022;
}
.setting-row{
    display:flex;
    flex-wrap:wrap;
    gap:15px;
    margin-bottom:12px;
    align-items:center;
}
.setting-item{
    display:flex;
    align-items:center;
    gap:6px;
}
.setting-item input{
    width:60px;
    padding:4px;
    font-size:14px;
}
.control-panel textarea{
    width:100%;
    padding:10px;
    font-size:16px;
    border:1px solid #ccc;
    border-radius:6px;
    margin-bottom:12px;
}
.control-panel .btn-group{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}
.control-panel button {
    padding: 10px 24px;
    font-size: 16px;
    cursor: pointer;
    border: none;
    border-radius: 6px;
    background: #2563eb;
    color: #fff;
}
.control-panel button.secondary{
    background:#666;
}

/* A4頁面容器(螢幕預覽模擬紙張) */
.a4-page {
    width: 210mm;
    min-height: 297mm;
    background: #ffffff;
    margin: 0 auto;
    padding: 10mm;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 0mm;
}

/* 單張A6表單容器 105mm × 148mm */
.a6-form {
    width: 105mm;
    height: 148mm;
    padding: 4mm;
}

/* 工單表格樣式【版型完全固定，不修改】 */
.work-table {
    width: 100%;
    height: 100%;
    border-collapse: collapse;
    border: 1.6px solid #000;
}
.work-table td {
    border: 1.6px solid #000;
    padding: 3mm;
    vertical-align: middle;
    font-weight: bold;
    font-size:var(--base-font);
}
/* 左側標題欄 */
.work-table td.label-col {
    text-align: center;
    width: 18%;
    font-size:var(--label-font);
}
/* 第一列：日期 + 線別 雙欄 */
.work-table tr:nth-child(1) td:nth-child(2) {
    width: 42%;
}
.work-table tr:nth-child(1) td:nth-child(3) {
    width: 18%;
}
.work-table tr:nth-child(1) td:nth-child(4) {
    width: 22%;
}
/* 資料填入欄位靠左對齊 */
.work-table td.data-cell {
    text-align: left;
    font-size:var(--content-font);
}

/* ========== 列印專用樣式 ========== */
@media print {
    /* 隱藏控制面板 */
    .control-panel {
        display: none !important;
    }
    body {
        background: #fff;
        padding: 0;
    }
    /* 強制A4直式、禁止瀏覽器自動縮放 */
    @page {
        size: A4 portrait;
        margin: 10mm;
    }
    .a4-page {
        width: 100%;
        height: 100%;
        padding: 0;
    }
}
</style>
</head>
<body>
<!-- 操作控制面板 -->
<div class="control-panel">
    <div class="setting-row">
        <div class="setting-item">
            <label>全域基礎字型(px)：</label>
            <input type="number" id="baseFont" value="15" min="10" max="30">
        </div>
        <div class="setting-item">
            <label>標籤字型(px)：</label>
            <input type="number" id="labelFont" value="15" min="10" max="30">
        </div>
        <div class="setting-item">
            <label>內容字型(px)：</label>
            <input type="number" id="contentFont" value="15" min="10" max="30">
        </div>
    </div>
    <h3>批次匯入｜一行=一筆，格式：庫別,日期,線別,M/O,機種,套數,備註,儲位</h3>
    <textarea id="inputText" rows="5" placeholder="範例：
W131,8/4,S07,48732467,UT3,50,R48.0G334.001A,G1RB0711"></textarea>
    <div class="btn-group">
        <button onclick="batchLoad()">批次載入資料</button>
        <button class="secondary" onclick="clearAll()">清空全部工單</button>
        <button onclick="window.print()">🖨️ 列印表單</button>
    </div>
</div>

<!-- A4紙張容器，內含2×2共4張A6表單 -->
<div class="a4-page">
    <div class="a6-form" id="form1"></div>
    <div class="a6-form" id="form2"></div>
    <div class="a6-form" id="form3"></div>
    <div class="a6-form" id="form4"></div>
</div>

<script>
//字型變數
const fontSetting = {
    base:15,
    label:15,
    content:15
};
//4組工單資料
let formData = [null,null,null,null];

//套用字型
function applyFont(){
    document.documentElement.style.setProperty('--base-font', fontSetting.base+'px');
    document.documentElement.style.setProperty('--label-font', fontSetting.label+'px');
    document.documentElement.style.setProperty('--content-font', fontSetting.content+'px');
}

//單張工單模板【版型完全固定，不做任何結構修改】
function getTemplate(data){
    if(!data) data={date:"",line:"",mo:"",model:"",qty:"",remark:""};
    return `
<table class="work-table">
    <tr>
        <td class="label-col">日　期</td>
        <td class="data-cell">${data.date}</td>
        <td class="label-col">線　別</td>
        <td class="data-cell">${data.line}</td>
    </tr>
    <tr>
        <td class="label-col">M/O</td>
        <td class="data-cell" colspan="3">${data.mo}</td>
    </tr>
    <tr>
        <td class="label-col">機　種</td>
        <td class="data-cell" colspan="3">${data.model}</td>
    </tr>
    <tr>
        <td class="label-col">套　數</td>
        <td class="data-cell" colspan="3">${data.qty}</td>
    </tr>
    <tr>
        <td class="label-col">備　註</td>
        <td class="data-cell" colspan="3">${data.remark}</td>
    </tr>
</table>`;
}

//重新渲染4張表單
function renderAll(){
    const list = [
        document.getElementById('form1'),
        document.getElementById('form2'),
        document.getElementById('form3'),
        document.getElementById('form4')
    ];
    for(let i=0;i<4;i++){
        list[i].innerHTML = getTemplate(formData[i]);
    }
}

//批次載入
function batchLoad(){
    const text = document.getElementById('inputText').value.trim();
    if(!text){
        alert("請填入資料！");
        return;
    }
    const rows = text.split(/\r?\n/).filter(r=>r.trim()!=='');
    formData = [null,null,null,null];
    for(let i=0;i<rows.length;i++){
        if(i>=4){
            alert("最多支援4筆，多餘資料忽略");
            break;
        }
        const arr = rows[i].split(',');
        if(arr.length!==8){
            alert(`第${i+1}行欄位錯誤，需8個欄位`);
            return;
        }
        formData[i]={
            date:arr[1].trim(),
            line:arr[2].trim(),
            mo:arr[3].trim(),
            model:arr[4].trim(),
            qty:arr[5].trim(),
            remark:arr[6].trim()
        };
    }
    renderAll();
    document.getElementById('inputText').value='';
    alert(`成功載入${Math.min(rows.length,4)}筆`);
}

//清空
function clearAll(){
    formData=[null,null,null,null];
    document.getElementById('inputText').value='';
    renderAll();
}

//字型監聽
document.getElementById('baseFont').addEventListener('input',e=>{
    fontSetting.base=Number(e.target.value);
    applyFont();
});
document.getElementById('labelFont').addEventListener('input',e=>{
    fontSetting.label=Number(e.target.value);
    applyFont();
});
document.getElementById('contentFont').addEventListener('input',e=>{
    fontSetting.content=Number(e.target.value);
    applyFont();
});

//初始化
applyFont();
renderAll();
</script>
</body>
</html>
