<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>WMS 倉儲管理系統</title>
<link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{--sat:max(env(safe-area-inset-top,0px),24px);--primary:#00d4ff;--primary-glow:rgba(0,212,255,0.4);--accent:#00ff88;--accent-glow:rgba(0,255,136,0.3);--bg-dark:#060b18;--bg-card:#0d1424;--bg-card-hover:#131c33;--text-primary:#e2e8f0;--text-secondary:#64748b;--text-accent:#00d4ff;--border-color:#1a2540;--border-glow:rgba(0,212,255,0.15);}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg-dark);color:var(--text-primary);min-height:100vh;overflow-x:hidden;}
body{background-image:linear-gradient(rgba(0,212,255,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,212,255,0.03) 1px,transparent 1px);background-size:30px 30px;background-attachment:fixed;}
/* 裝飾光球 */
.glow-orb{position:fixed;border-radius:50%;filter:blur(80px);opacity:0.12;pointer-events:none;z-index:0;}
.glow-orb-1{width:300px;height:300px;background:var(--primary);top:-100px;right:-100px;}
.glow-orb-2{width:250px;height:250px;background:var(--accent);bottom:50px;left:-100px;}
/* 頂部導航欄 */
.navbar{position:fixed;top:0;left:0;right:0;height:100px;z-index:100;background:rgba(6,11,24,0.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border-color);display:flex;flex-direction:column;}
.navbar::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent 10%,var(--primary) 50%,transparent 90%);opacity:0.5;}
.status-bar{height:var(--sat);}
.nav-content{flex:1;display:flex;align-items:center;justify-content:center;padding-bottom:20px;position:relative;}
.nav-title{font-size:18px;font-weight:600;color:var(--text-primary);letter-spacing:2px;display:flex;align-items:center;gap:10px;}
.nav-title i{color:var(--primary);text-shadow:0 0 12px var(--primary-glow);font-size:20px;}
/* 系統狀態條 */
.sys-status{position:fixed;top:100px;left:0;right:0;height:32px;background:rgba(13,20,36,0.6);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:space-between;padding:0 20px;z-index:99;border-bottom:1px solid rgba(26,37,64,0.5);}
.sys-status-left{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--text-secondary);letter-spacing:1px;}
.sys-status-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent-glow);animation:pulse 2s ease infinite;}
.sys-status-right{font-size:11px;color:var(--text-secondary);letter-spacing:1px;font-variant-numeric:tabular-nums;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.4;}}
/* 主內容區 */
.main-content{padding-top:148px;padding-bottom:40px;padding-left:16px;padding-right:16px;max-width:600px;margin:0 auto;position:relative;z-index:1;}
/* 區塊卡片 */
.section-card{background:var(--bg-card);border:1px solid var(--border-color);border-radius:16px;margin-bottom:20px;overflow:hidden;position:relative;animation:fadeUp 0.5s ease backwards;}
.section-card:nth-child(1){animation-delay:0.1s;}
.section-card:nth-child(2){animation-delay:0.2s;}
.section-card:nth-child(3){animation-delay:0.3s;}
.section-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent 5%,var(--primary) 50%,transparent 95%);opacity:0.6;}
.section-header{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--border-color);background:linear-gradient(180deg,rgba(0,212,255,0.04),transparent);}
.section-icon{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,rgba(0,212,255,0.15),rgba(0,255,136,0.05));display:flex;align-items:center;justify-content:center;border:1px solid rgba(0,212,255,0.2);flex-shrink:0;}
.section-icon i{font-size:16px;color:var(--primary);}
.section-title{font-size:16px;font-weight:600;color:var(--text-primary);letter-spacing:1px;}
.section-badge{margin-left:auto;font-size:11px;color:var(--text-accent);background:rgba(0,212,255,0.08);padding:3px 12px;border-radius:20px;border:1px solid rgba(0,212,255,0.15);font-weight:500;}
/* 按鈕列表 */
.btn-list{padding:6px;}
.btn-item{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:12px;cursor:pointer;transition:background 0.2s ease,transform 0.15s ease;position:relative;overflow:hidden;border:1px solid transparent;}
.btn-item:active{background:var(--bg-card-hover);transform:scale(0.98);}
.btn-item::after{content:'';position:absolute;left:0;top:50%;width:3px;height:0;background:var(--primary);border-radius:0 3px 3px 0;transition:height 0.25s ease;transform:translateY(-50%);}
.btn-item:active::after{height:50%;}
.btn-index{width:28px;height:28px;border-radius:8px;background:rgba(0,212,255,0.06);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--text-accent);flex-shrink:0;border:1px solid rgba(0,212,255,0.12);font-variant-numeric:tabular-nums;}
.btn-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.05);}
.btn-icon i{font-size:16px;color:var(--text-secondary);transition:color 0.2s;}
.btn-item:active .btn-icon i{color:var(--primary);}
.btn-text{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0;}
.btn-name{font-size:15px;font-weight:500;color:var(--text-primary);letter-spacing:0.5px;}
.btn-desc{font-size:11px;color:var(--text-secondary);letter-spacing:0.5px;}
.btn-arrow{flex-shrink:0;color:var(--text-secondary);font-size:12px;transition:transform 0.2s,color 0.2s;}
.btn-item:active .btn-arrow{transform:translateX(4px);color:var(--primary);}
/* 波紋效果 */
.ripple{position:absolute;border-radius:50%;background:rgba(0,212,255,0.25);transform:scale(0);animation:rippleAnim 0.6s ease-out;pointer-events:none;}
@keyframes rippleAnim{to{transform:scale(4);opacity:0;}}
/* 底部信息 */
.footer{text-align:center;padding:20px 16px 40px;position:relative;z-index:1;}
.footer-text{font-size:11px;color:var(--text-secondary);letter-spacing:2px;}
.footer-text span{color:var(--primary);}
/* 加載層 */
.loading-overlay{position:fixed;inset:0;background:rgba(6,11,24,0.92);backdrop-filter:blur(10px);z-index:999;display:none;align-items:center;justify-content:center;flex-direction:column;gap:20px;}
.loading-overlay.active{display:flex;}
.loading-spinner{width:48px;height:48px;border:3px solid rgba(0,212,255,0.1);border-top-color:var(--primary);border-radius:50%;animation:spin 0.8s linear infinite;}
.loading-text{font-size:14px;color:var(--primary);letter-spacing:3px;}
@keyframes spin{to{transform:rotate(360deg);}}
/* 入場動畫 */
@keyframes fadeUp{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
</style>
</head>
<body>
<!-- 裝飾光球 -->
<div class="glow-orb glow-orb-1"></div>
<div class="glow-orb glow-orb-2"></div>

<!-- 頂部導航欄 -->
<div class="navbar">
  <div class="status-bar"></div>
  <div class="nav-content">
    <div class="nav-title"><i class="fa-solid fa-warehouse"></i> WMS 倉儲管理系統</div>
  </div>
</div>

<!-- 系統狀態條 -->
<div class="sys-status">
  <div class="sys-status-left">
    <div class="sys-status-dot"></div>
    <span>系統運行中</span>
  </div>
  <div class="sys-status-right" id="sysTime">--:--:--</div>
</div>

<!-- 主內容區 -->
<div class="main-content" id="mainContent">
  <!-- 區塊由JS動態生成 -->
</div>

<!-- 底部信息 -->
<div class="footer">
  <div class="footer-text"><span>Wistron</span> · LMS Warehouse Management System</div>
</div>

<!-- 加載層 -->
<div class="loading-overlay" id="loadingOverlay">
  <div class="loading-spinner"></div>
  <div class="loading-text">正在跳轉...</div>
</div>

<script>
// ========== 數據配置 ==========
const sections = [
  {
    title: '庫存管理',
    icon: 'fa-boxes-stacked',
    badge: '5 項',
    items: [
      { name: '庫存報表', url: 'https://lms.wiha3.wistron.com/WM/WMWebReports/WMRINV008.aspx', icon: 'fa-chart-column', desc: '操作說明待補充' },
      { name: '工單分配物料', url: 'https://lms.wiha3.wistron.com/WM/WMWebClients/WMTPICKUPA11.ASPX', icon: 'fa-clipboard-list', desc: '操作說明待補充' },
      { name: '庫位移轉', url: 'https://lms.wiha3.wistron.com/WM/WMWebClients/WMTPICKUPA01.ASPX', icon: 'fa-arrows-left-right', desc: '操作說明待補充' },
      { name: '工单備料除帳', url: 'https://lms.wiha3.wistron.com/WM/WMWebClients/WMTPICKUPA23.ASPX', icon: 'fa-file-invoice', desc: '操作說明待補充' },
      { name: '列印挑料單', url: 'https://lms.wiha3.wistron.com/WM/WMWebClients/WMTLABELA06.ASPX', icon: 'fa-print', desc: '操作說明待補充' }
    ]
  },
  {
    title: '單據管理',
    icon: 'fa-file-lines',
    badge: '4 項',
    items: [
      { name: '簽單狀態報表', url: 'https://lms.wiha3.wistron.com/WM/WMWebReports/WMRTICKET002.ASPX', icon: 'fa-chart-line', desc: '操作說明待補充' },
      { name: '單據交接', url: 'https://lms.wiha3.wistron.com/WM/WMWebClients/WMTTICKETA01.ASPX', icon: 'fa-handshake', desc: '操作說明待補充' },
      { name: '單據分配物料', url: 'https://lms.wiha3.wistron.com/WM/WMWebClients/WMTTICKET001.ASPX', icon: 'fa-list-check', desc: '操作說明待補充' },
      { name: '貨到儲位核對', url: 'https://lms.wiha3.wistron.com/WM/WMWebClients/WMTPUTAWAYA03.ASPX', icon: 'fa-warehouse', desc: '操作說明待補充' }
    ]
  },
  {
    title: '系統工具',
    icon: 'fa-screwdriver-wrench',
    badge: '2 項',
    items: [
      { name: 'Bin to Bin Transfer', url: 'https://lms.wiha3.wistron.com/WM/SmartClients/WMTTRANSFER002/WMTTRANSFER002.application?Plant=F606&CULTURENAME=zh-TW&SECURITYTOKEN=5EAC776052CA1844A16C56BF3700C45C0595F74325E77216A57AC4AD8458A04D6DD1B97EE35D55C3DDB09A4319EC3ACB66C41B56F1ED76E2A75E7EE7A1CE6967E5982C9C43C502F313670CAD6C8D1BE80227748AB773E88E5F7E005A9C4652F05D9B7F7BC68D99C76BEED1223E5C0128B46C3F31645E4F4BA7C09970CC34432AC3B2FF6555D01E9F3F0C83704D9B13E5861659F14989F6F9C38B84772D71B3AA136B248A1E494442F463DC80F618722C06E89111E8A1D2E6388A65B18826AD963689C991', icon: 'fa-right-left', desc: '操作說明待補充' },
      { name: '補印WMS標籤', url: 'https://lms.wiha3.wistron.com/WM/WMWebClients/WMTLABEL013.ASPX', icon: 'fa-tag', desc: '操作說明待補充' }
    ]
  }
];

// ========== 應用主類 ==========
class App {
  constructor() {
    this.mainContent = null;
    this.loadingOverlay = null;
    this.sysTimeEl = null;
    this.clockTimer = null;
  }

  // 初始化
  init() {
    this.mainContent = document.getElementById('mainContent');
    this.loadingOverlay = document.getElementById('loadingOverlay');
    this.sysTimeEl = document.getElementById('sysTime');
    this.renderSections();
    this.bindEvents();
    this.startClock();
  }

  // 渲染所有區塊
  renderSections() {
    let html = '';
    sections.forEach(function(section, sIndex) {
      // 區塊卡片開始
      html += '<div class="section-card">';
      // 區塊標題
      html += '<div class="section-header">';
      html += '<div class="section-icon"><i class="fa-solid ' + section.icon + '"></i></div>';
      html += '<div class="section-title">' + section.title + '</div>';
      html += '<div class="section-badge">' + section.badge + '</div>';
      html += '</div>';
      // 按鈕列表
      html += '<div class="btn-list">';
      section.items.forEach(function(item, iIndex) {
        html += '<div class="btn-item" data-url="' + item.url + '">';
        html += '<div class="btn-index">' + iIndex + '</div>';
        html += '<div class="btn-icon"><i class="fa-solid ' + item.icon + '"></i></div>';
        html += '<div class="btn-text">';
        html += '<div class="btn-name">' + item.name + '</div>';
        html += '<div class="btn-desc">' + item.desc + '</div>';
        html += '</div>';
        html += '<div class="btn-arrow"><i class="fa-solid fa-chevron-right"></i></div>';
        html += '</div>';
      });
      html += '</div>';
      html += '</div>';
    });
    this.mainContent.innerHTML = html;
  }

  // 綁定事件
  bindEvents() {
    // 按鈕點擊事件委託
    var self = this;
    this.mainContent.addEventListener('click', function(e) {
      var btnItem = e.target.closest('.btn-item');
      if (!btnItem) return;

      var url = btnItem.dataset.url;
      if (!url) return;

      // 創建波紋效果
      self.createRipple(e, btnItem);

      // 顯示加載層
      self.loadingOverlay.classList.add('active');

      // 延遲跳轉，讓動畫完成
      setTimeout(function() {
        window.location.href = url;
      }, 600);
    });
  }

  // 創建波紋效果
  createRipple(event, element) {
    var rect = element.getBoundingClientRect();
    var size = Math.max(rect.width, rect.height);
    var x = event.clientX - rect.left - size / 2;
    var y = event.clientY - rect.top - size / 2;
    var ripple = document.createElement('span');
    ripple.className = 'ripple';
    ripple.style.width = size + 'px';
    ripple.style.height = size + 'px';
    ripple.style.left = x + 'px';
    ripple.style.top = y + 'px';
    element.appendChild(ripple);
    setTimeout(function() {
      if (ripple.parentNode) ripple.parentNode.removeChild(ripple);
    }, 600);
  }

  // 系統時鐘
  startClock() {
    var self = this;
    function update() {
      var now = new Date();
      var h = String(now.getHours()).padStart(2, '0');
      var m = String(now.getMinutes()).padStart(2, '0');
      var s = String(now.getSeconds()).padStart(2, '0');
      self.sysTimeEl.textContent = h + ':' + m + ':' + s;
    }
    update();
    this.clockTimer = setInterval(update, 1000);
  }
}

// ========== 初始化 ==========
var app = new App();
document.addEventListener('DOMContentLoaded', function() {
  app.init();
});
</script>
</body>
</html>
