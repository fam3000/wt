<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PCB 拆袋計算機 (塊/片 換算)</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }
        body {
            background: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 20px;
            padding: 10px;
        }
        .container {
            max-width: 700px;
            width: 100%;
            background: white;
            border-radius: 32px;
            padding: 30px 28px;
            box-shadow: 0 20px 40px -12px rgba(0,0,0,0.25);
            border: 1px solid #e9edf2;
        }
        h1 {
            font-size: 24px;
            font-weight: 700;
            color: #0b2b4a;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 0;
            margin-bottom: 6px;
        }
        .subtitle {
            color: #5e6f8d;
            font-size: 14px;
            font-weight: 400;
            border-bottom: 2px solid #eef2f7;
            padding-bottom: 16px;
            margin-bottom: 24px;
        }
        .badge {
            background: #d4e2fc;
            color: #1a4b8c;
            font-size: 13px;
            font-weight: 600;
            padding: 2px 12px;
            border-radius: 30px;
        }
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 12px;
        }
        .input-group label {
            font-weight: 600;
            font-size: 14px;
            color: #1f3a5f;
            letter-spacing: 0.3px;
        }
        .input-group .hint {
            font-weight: 400;
            font-size: 12px;
            color: #7b8aa3;
            margin-left: 6px;
        }
        .input-group input {
            padding: 12px 14px;
            border: 1.5px solid #dbe0e8;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 500;
            background: #fafcff;
            transition: 0.2s;
            width: 100%;
        }
        .input-group input:focus {
            border-color: #2a6df4;
            outline: none;
            background: white;
            box-shadow: 0 0 0 3px rgba(42, 109, 244, 0.15);
        }
        .input-group input:disabled {
            background: #eef2f7;
            color: #1f3a5f;
            font-weight: 700;
        }
        .checkbox-row{
            display:flex;
            align-items:center;
            gap:8px;
            margin:4px 0 16px 0;
        }
        .btn-calc {
            background: #1a4b8c;
            color: white;
            border: none;
            padding: 16px 20px;
            border-radius: 60px;
            font-size: 18px;
            font-weight: 700;
            width: 100%;
            cursor: pointer;
            transition: 0.2s;
            margin: 12px 0 18px 0;
            letter-spacing: 1px;
        }
        .btn-calc:hover {
            background: #0d3b73;
            transform: scale(1.01);
            box-shadow: 0 8px 16px -6px rgba(26, 75, 140, 0.3);
        }
        .result-area {
            background: #f8fbff;
            border-radius: 24px;
            padding: 20px 22px;
            border: 1px solid #dce5f0;
            margin-top: 10px;
        }
        .result-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px dashed #dce5f0;
        }
        .result-row:last-child {
            border-bottom: none;
        }
        .result-label {
            font-weight: 600;
            color: #1f3a5f;
            font-size: 15px;
        }
        /* 移除數值背景、圓框、陰影 */
        .result-value {
            font-size: 20px;
            font-weight: 800;
            background: transparent;
            padding: 0;
            border-radius: 0;
            box-shadow: none;
        }
        .tag-1 { color: #0057a3; }
        .tag-2 { color: #0a7e6b; }
        .tag-3 { color: #a3531b; }
        .tag-box {
            display: inline-block;
            padding: 2px 12px;
            border-radius: 40px;
            font-size: 12px;
            font-weight: 700;
            background: #eef2f7;
        }
        .footer-note {
            font-size: 13px;
            color: #6b7d9c;
            margin-top: 18px;
            text-align: center;
            border-top: 1px solid #eef2f7;
            padding-top: 16px;
            line-height:1.6;
        }
        .print-info{
            margin-top:12px;
            font-size:14px;
            color:#3d5a78;
            background:#eaf0f8;
            padding:10px 14px;
            border-radius:20px;
            text-align:center;
            line-height: 1.8;
        }
        .align-row{
            display:grid;
            grid-template-columns: 1fr 1fr 1fr;
        }
        @media (max-width: 500px) {
            .grid-2 { grid-template-columns: 1fr; }
            .container { padding: 20px; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📦 PCB 拆袋計算機 <span class="badge">塊 / 片 換算</span></h1>
    <div class="subtitle">輸入袋子資訊與工單需求，自動算出三張 2S 標籤數量</div>

    <!-- 第一行：左=工單需求 右=已拿數量 -->
    <div class="grid-2">
        <div class="input-group">
            <label>工單需求</label>
            <input type="number" id="demandPcs" value="" step="any" min="0">
        </div>
        <div class="input-group">
            <label>已拿數量 <span class="hint">多筆以空格隔開</span></label>
            <input type="text" id="takenNum" value="" placeholder="例：12 25 8">
        </div>
    </div>
    <!-- 同箱勾選框 -->
    <div class="checkbox-row">
        <input type="checkbox" id="sameBoxCheck">
        <label for="sameBoxCheck">已拿數量屬於當前拆袋同一箱（勾選將自動扣除本箱已拿）</label>
    </div>
    <!-- 第二行：整箱數量 -->
    <div class="grid-2">
        <div class="input-group">
            <label>整箱數量</label>
            <input type="number" id="otherStock" value="" step="any" min="0">
        </div>
        <div class="input-group">
            <!-- 留白保持grid對齊 -->
        </div>
    </div>
    <!-- 第三行：拆袋數量 + 拆袋塊數 -->
    <div class="grid-2">
        <div class="input-group">
            <label>拆袋數量</label>
            <input type="number" id="totalPcs" value="" step="any" min="0">
        </div>
        <div class="input-group">
            <label>拆袋塊數</label>
            <input type="number" id="totalPanels" value="" step="any" min="0">
        </div>
    </div>

    <div class="input-group">
        <label>連板數量</label>
        <input type="text" id="displayK" value="" disabled style="background:#eef2f7; font-weight:700; color:#0b2b4a;">
    </div>

    <!-- 按鈕移除圖標 -->
    <button class="btn-calc" onclick="calculate()">計算拆袋數量 & 標籤</button>

    <!-- 結果顯示 -->
    <div class="result-area" id="resultArea">
        <div class="result-row">
            <span class="result-label">需拿取塊數</span>
            <span class="result-value" id="resultTakePanels">0</span>
        </div>
        <!-- ① 標籤維持原本顯示格式 -->
        <div class="result-row">
            <span class="result-label"><span class="tag-box tag-1">①</span> 拆/分袋工單需求數量</span>
            <span class="result-value tag-1" id="resultLabel1">0</span>
        </div>
        <!-- ② 只顯示純數字，移除（剩餘X塊）文字 -->
        <div class="result-row">
            <span class="result-label"><span class="tag-box tag-2">②</span> 拆/分袋剩餘庫存數量</span>
            <span class="result-value tag-2" id="resultLabel2">0</span>
        </div>
        <!-- ③ 維持不變 -->
        <div class="result-row">
            <span class="result-label"><span class="tag-box tag-3">③</span> 總箱數</span>
            <span class="result-value tag-3" id="resultLabel3">0</span>
        </div>
        <!-- 底部四行排版不動 -->
        <div class="print-info" id="printDesc">
            0塊，0片，0連板<br>
            列印2S標籤3張<br>
            <div class="align-row">
                <span>①工單數</span>
                <span>②庫存數</span>
                <span>③外箱數</span>
            </div>
            <div class="align-row">
                <span id="num1">0塊=0片</span>
                <span id="num2">0塊=0片</span>
                <span id="num3">0</span>
            </div>
        </div>
    </div>
    <!-- 頁尾流程文字不變 -->
    <div class="footer-note">
        1.先拍照拆袋標籤QR，2.截圖計算結果，3.填寫盤點卡，4.印2S標籤並貼上，5.真空封袋
    </div>
</div>

<script>
    // 計算已拿總量（支援空格多筆輸入）
    function getSumTaken(){
        const inputVal = document.getElementById('takenNum').value.trim();
        if(!inputVal) return 0;
        const arr = inputVal.split(/\s+/).map(item=>parseFloat(item)).filter(n=>!isNaN(n) && n>0);
        return arr.reduce((sum,val)=>sum+val,0);
    }

    function calculate() {
        // 取得輸入值
        const R = parseFloat(document.getElementById('demandPcs').value) || 0;
        const totalTaken = getSumTaken();
        const isSameBox = document.getElementById('sameBoxCheck').checked;
        const C = parseFloat(document.getElementById('otherStock').value) || 0;
        const A = parseFloat(document.getElementById('totalPcs').value) || 0;
        const B = parseFloat(document.getElementById('totalPanels').value) || 0;

        // 基礎驗證
        if (isNaN(A) || isNaN(B) || A <= 0 || B <= 0) {
            alert('請確認「拆袋數量」、「拆袋塊數」皆為有效正數！');
            return;
        }

        // 單塊連板片數
        const K = A / B;
        if (!Number.isInteger(K)) {
            alert(`數據異常！\n拆袋數量 ${A} ÷ 拆袋塊數 ${B} = ${K}，無法整除\n每塊連板片數必須為整數，請修正袋裝資訊`);
            document.getElementById('resultTakePanels').innerText = `數據無法均分：${K}`;
            document.getElementById('displayK').value = K.toFixed(2);
            return;
        }
        document.getElementById('displayK').value = K;

        // 計算實際還需片數
        const realNeed = R - totalTaken;

        if (realNeed <= 0) {
            alert('扣除已拿數量後，無需再取料！');
            document.getElementById('resultTakePanels').innerText = 0;
            document.getElementById('resultLabel1').innerText = 0;
            const label2Num = A;
            const remainPanels = B;
            // ②只填入純數字，移除文字
            document.getElementById('resultLabel2').innerText = label2Num;
            
            let label3;
            if(isSameBox){
                label3 = (C - totalTaken) - A + label2Num;
            }else{
                label3 = C - A + label2Num;
            }
            document.getElementById('resultLabel3').innerText = label3;
            document.getElementById('num1').innerText = `0塊=0片`;
            document.getElementById('num2').innerText = `${remainPanels}塊=${label2Num}片`;
            document.getElementById('num3').innerText = label3;
            document.getElementById('printDesc').innerHTML = `${B}塊，${A}片，${K}連板<br>列印2S標籤3張<br><div class="align-row"><span>①工單數</span><span>②庫存數</span><span>③外箱數</span></div><div class="align-row"><span id="num1">0塊=0片</span><span id="num2">${remainPanels}塊=${label2Num}片</span><span id="num3">${label3}</span></div>`;
            return;
        }

        // 需拿取塊數
        const takePanels = realNeed / K;
        if (!Number.isInteger(takePanels)) {
            alert(`需求數據異常！\n還需 ${realNeed} 片 ÷ 單板 ${K} 片 = ${takePanels} 塊，無法整除\n只能拿整塊連板，請調整需求數量`);
            document.getElementById('resultTakePanels').innerText = `數據無法均分：${takePanels}`;
            return;
        }

        // 庫存不足判斷
        if (takePanels > B) {
            alert(`此袋最多只有 ${B} 塊，但需求換算需 ${takePanels} 塊，庫存不足！`);
            document.getElementById('resultTakePanels').innerText = `${takePanels}塊 庫存不足`;
            return;
        }

        // 標籤①②計算
        const label1 = takePanels * K;
        const remainPanels = B - takePanels;
        const label2Num = remainPanels * K;

        // 標籤③總箱數
        let label3;
        if(isSameBox){
            label3 = (C - totalTaken) - A + label2Num;
        }else{
            label3 = C - A + label2Num;
        }

        // 渲染結果
        document.getElementById('resultTakePanels').innerText = takePanels;
        document.getElementById('resultLabel1').innerText = label1;
        // ②只顯示純數字
        document.getElementById('resultLabel2').innerText = label2Num;
        document.getElementById('resultLabel3').innerText = label3;
        // 底部對齊行完全不動
        document.getElementById('num1').innerText = `${takePanels}塊=${label1}片`;
        document.getElementById('num2').innerText = `${remainPanels}塊=${label2Num}片`;
        document.getElementById('num3').innerText = label3;
        document.getElementById('printDesc').innerHTML = `${B}塊，${A}片，${K}連板<br>列印2S標籤3張<br><div class="align-row"><span>①工單數</span><span>②庫存數</span><span>③外箱數</span></div><div class="align-row"><span id="num1">${takePanels}塊=${label1}片</span><span id="num2">${remainPanels}塊=${label2Num}片</span><span id="num3">${label3}</span></div>`;
    }

    // 即時更新倍率顯示
    document.getElementById('totalPcs').addEventListener('input', updateK);
    document.getElementById('totalPanels').addEventListener('input', updateK);

    function updateK() {
        const A = parseFloat(document.getElementById('totalPcs').value);
        const B = parseFloat(document.getElementById('totalPanels').value);
        if (!isNaN(A) && !isNaN(B) && B > 0) {
            const rawK = A / B;
            if (Number.isInteger(rawK)) {
                document.getElementById('displayK').value = rawK;
            } else {
                document.getElementById('displayK').value = `數據無法均分：${rawK}`;
            }
        } else {
            document.getElementById('displayK').value = '請輸入有效數字';
        }
    }

    window.onload = function() {
        updateK();
    };
</script>

</body>
</html>
