6px;font-size:14px;font-weight:600;cursor:pointer;margin-top:8px;-webkit-appearance:none;appearance:none;}.stats-panel{background-color:#161b22;border:1px solid #30363d;border-radius:10px;padding:12px;margin-bottom:12px;overflow-x:hidden;}.stats-title{font-size:16px;margin-bottom:8px;color:#58a6ff;font-weight:600;}.stats-normal{}.stat-group{border-bottom:1px dashed #444c56;padding:8px 0;}.stat-group:last-child{border-bottom:none;}.stat-line{display:flex;justify-content:space-between;padding:4px 0;font-size:15px;flex-wrap:wrap;gap:6px;}.stat-line span:first-child{flex-shrink:0;}.stat-line span:last-child{flex:1;text-align:right;word-wrap:break-word;word-break:break-all;}.calc-line{display:flex;justify-content:space-between;padding:4px 0;font-size:15px;flex-wrap:wrap;gap:6px;}.calc-line span:first-child{flex-shrink:0;}.calc-line span:last-child{flex:1;text-align:right;word-wrap:break-word;word-break:break-all;}.calc-value{color:#b89248;font-weight:600;}.trace-wrap{margin:6px 0;padding:6px 0;border-bottom:1px solid #22272e;}.trace-wrap:last-of-type{border-bottom:none;}.trace-head{display:flex;gap:8px;font-size:14px;line-height:1.5;margin-bottom:4px;flex-wrap:wrap;}.trace-good{color:#22c55e;font-weight:600;flex-shrink:0;}.trace-warning{color:#f59e0b;font-weight:600;flex-shrink:0;}.trace-expired{color:#f85149;font-weight:600;flex-shrink:0;}.trace-head-text{flex:1;word-wrap:break-word;word-break:break-all;}.trace-pc-list{font-size:14px;padding-left:42px;line-height:1.5;word-wrap:break-word;word-break:break-all;color:#c9d1d9;}.trace-sub-title{font-size:14px;margin:6px 0 4px;color:#94a3b8;}.color-desc{margin-top:12px;padding-top:8px;border-top:1px solid #22272e;font-size:13px;line-height:1.6;}.desc-green{color:#22c55e;}.desc-yellow{color:#f59e0b;}.desc-red{color:#f85149;}.stats-table{display:none;}.bottom-clear{margin-top:8px;display:flex;flex-direction:column;gap:8px;}.btn-clear-all{width:100%;height:44px;background-color:#da3633;color:white;border:none;border-radius:6px;font-size:14px;font-weight:600;cursor:pointer;-webkit-appearance:none;appearance:none;}.btn-copy{width:100%;height:42px;background-color:#2563eb;color:white;border-radius:6px;font-size:14px;font-weight:600;cursor:pointer;border:none;-webkit-appearance:none;appearance:none;}.btn-print{width:100%;height:42px;background-color:#10b981;color:white;border-radius:6px;font-size:14px;font-weight:600;cursor:pointer;border:none;-webkit-appearance:none;appearance:none;}.btn-copy-full{width:100%;height:40px;background-color:#f97316;color:white;border-radius:6px;font-size:14px;font-weight:600;cursor:pointer;border:none;-webkit-appearance:none;appearance:none;}.import-wrap{margin-top:16px;display:flex;flex-direction:column;gap:8px;}.btn-toggle-import{width:100%;height:40px;background-color:#6366f1;color:#fff;border:none;border-radius:6px;font-size:14px;font-weight:600;cursor:pointer;-webkit-appearance:none;appearance:none;}.import-box{display:none;flex-direction:column;gap:8px;}.import-textarea{width:100%;min-height:120px;padding:10px;background:#161b22;border:1px solid #30363d;border-radius:6px;color:#e6edf3;font-size:14px;resize:vertical;}.import-textarea:focus{outline:none;border-color:#58a6ff;}.btn-load-import{width:100%;height:40px;background-color:#0ea5e9;color:#fff;border:none;border-radius:6px;font-size:14px;font-weight:600;cursor:pointer;-webkit-appearance:none;appearance:none;}.confirm-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.6);z-index:1000;display:none;align-items:center;justify-content:center;}.confirm-box{background:#161b22;border:1px solid #30363d;border-radius:10px;padding:20px;width:85%;max-width:320px;box-shadow:0 8px 32px rgba(0,0,0,0.3);}.confirm-icon{font-size:28px;text-align:center;margin-bottom:6px;}.confirm-title{font-size:16px;font-weight:600;color:#58a6ff;margin-bottom:8px;text-align:center;}.confirm-msg{font-size:14px;color:#e6edf3;margin-bottom:16px;line-height:1.6;text-align:center;white-space:pre-line;}.confirm-btns{display:flex;gap:10px;}.confirm-cancel{flex:1;height:40px;background:#444c56;color:#e6edf3;border:none;border-radius:6px;font-size:14px;font-weight:600;cursor:pointer;-webkit-appearance:none;appearance:none;}.confirm-ok{flex:1;height:40px;background:#238636;color:#fff;border:none;border-radius:6px;font-size:14px;font-weight:600;cursor:pointer;-webkit-appearance:none;appearance:none;}.confirm-ok.confirm-danger{background:#da3633;}.confirm-ok.confirm-purple{background:#9333ea;}.confirm-ok.confirm-blue{background:#2563eb;}.confirm-ok.confirm-teal{background:#0891b2;}.print-only{display:none;}.toast{position:fixed;bottom:40px;left:50%;transform:translateX(-50%);background-color:#238636;color:white;padding:10px 20px;border-radius:8px;font-size:14px;display:none;z-index:999;}@media print{.nav-bar{display:none !important;}body,html{background:#fff !important;padding-top:0 !important;padding-left:0 !important;padding-right:0 !important;}body *{visibility:hidden;}#printArea,#printArea *{visibility:visible;}#printArea{position:absolute;left:0;top:0;width:100%;background:transparent !important;color:#000 !important;padding:6px !important;border:none !important;border-radius:0 !important;}#printArea .stats-panel{background:transparent !important;border:none !important;padding:0 !important;}#printArea .stats-normal{display:none !important;}#printArea .stats-table{display:table !important;width:100%;border-collapse:collapse;font-size:10px;margin-top:4px;}#printArea .stats-table th,#printArea .stats-table td{border:1px solid #555;padding:2px 3px;text-align:left;vertical-align:top;font-size:10px;color:#000 !important;line-height:1.3;}#printArea .stats-table th{background:#ddd !important;font-weight:bold;text-align:center;font-size:10px;}#printArea .color-desc{border-top:1px #999 solid !important;font-size:10px;color:#333 !important;margin-top:6px;padding-top:4px;}#printArea .desc-green,#printArea .desc-yellow,#printArea .desc-red{color:#000 !important;}.print-only{display:inline !important;color:#000 !important;font-weight:bold;}.import-wrap,.pda-wrap,.manual-wrap,.bottom-clear,.nav-bar{display:none !important;}};</style></head><body>
<!-- 顶部导航栏 --><div class="nav-bar"><span class="nav-title">PCB / 料件箱數統計系統</span></div>
<div class="container">
    <!-- PDA掃碼工具 -->
    <div class="pda-wrap">
        <button class="btn-pda-toggle" id="btnPdaToggle">▼ PDA掃碼工具</button>
        <div class="pda-box" id="pdaBox">
            <input class="pda-input" id="pdaStack" placeholder="輸入棧號">
            <div class="pda-scan-status">
                <span class="pda-scan-count">目前筆數：<strong id="pdaScanCount">0</strong>
                    <span class="pda-dup-info" id="pdaDupInfo"></span>
                    <span class="pda-dup-info" id="pdaInvalidInfo"></span>
                </span>
                <button class="pda-scan-undo" id="btnPdaUndo">↩ 回上一步</button>
            </div>
            <div id="pdaStatusMsg" class="pda-dup-info" style="display:none;"></div>
            <textarea class="pda-textarea" id="pdaScanText" placeholder="貼上PDA掃描條碼，每行一筆&#10;格式範例：料號-001|TR-252001|150||S0001"></textarea>
            <button class="btn-pda-submit" id="btnPdaParse">解析並匯入統計</button>
        </div>
    </div>

    <!-- 手動輸入工具 -->
    <div class="manual-wrap">
        <button class="btn-manual-toggle" id="btnManualToggle">▼ 手動輸入工具</button>
        <div class="manual-box" id="manualBox">
            <div class="input-panel">
                <div id="rowsWrap">
                    <div class="input-row">
                        <button class="btn-del-row" id="btnDelRow1">×</button>
                        <input type="text" class="stackInput" placeholder="棧號"><input type="text" class="partInput" placeholder="料號"><input type="text" inputmode="numeric" class="traceInput" placeholder="TRACE ID"><input type="text" inputmode="numeric" class="qtyInput" placeholder="片數(多數值按空白鍵分隔，每個數字=1箱)"><input type="tel" class="boxInput" placeholder="箱數（預設1，多數值時自動忽略）">
                        <div class="row-btn-group"><button class="btn-space" id="btnSpace1">空白</button><button class="btn-submit" id="btnSubmit1">送出本筆</button></div>
                    </div>
                </div>
                <button class="btn-add-row" id="btnAddRow">➕ 新增輸入列</button>
                <button class="btn-batch-all" id="btnBatchAll">🔹 全部列一次送出</button>
            </div>
        </div>
    </div>

    <!-- 統計面板 -->
    <div id="printArea" class="stats-panel">
        <div class="stats-title">📊 整體統計結果</div>
        <div id="mainStats" class="stats-normal"></div>
        <table id="printTable" class="stats-table"></table>
        <div class="color-desc"><div><span class="desc-green">● 綠色</span>：可使用（剩餘到期超過30天）</div><div><span class="desc-yellow">● 黃色</span>：即將過期（剩餘到期30天內）</div><div><span class="desc-red">● 紅色</span>：已過期</div></div>
    </div>

    <!-- 底部按鈕 -->
    <div class="bottom-clear">
        <button class="btn-clear-all" id="btnClearAll">重置</button>
        <button class="btn-copy" id="btnCopy">複製規格化資料</button>
        <button class="btn-print" id="btnPrint">列印統計內容</button>
    </div>

    <!-- 匯入區 -->
    <div class="import-wrap">
        <button class="btn-copy-full" id="btnCopyFull">複製規格化完整資料</button>
        <button class="btn-toggle-import" id="btnToggleImport">展開/收合 匯入彙總規格CSV</button>
        <div class="import-box" id="importBox">
            <textarea class="import-textarea" id="importTextarea" placeholder="貼入複製的資料，包含完整明細的完整資料也可在此匯入還原"></textarea>
            <button class="btn-load-import" id="btnLoadImport">載入彙總資料</button>
        </div>
    </div>
</div>

<!-- 確認彈窗 -->
<div class="confirm-overlay" id="confirmOverlay">
    <div class="confirm-box">
        <div class="confirm-icon" id="confirmIcon">⚠️</div>
        <div class="confirm-title" id="confirmTitle">確認</div>
        <div class="confirm-msg" id="confirmMsg">確定要執行此操作嗎？</div>
        <div class="confirm-btns"><button class="confirm-cancel" id="confirmCancelBtn">取消</button><button class="confirm-ok" id="confirmOkBtn">確認</button></div>
    </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
/* ===== 工具函數：ISO週日期計算 ===== */
function getISOWeekDates(year, week) {
    const simple = new Date(year, 0, 1 + (week - 1) * 7);
    const dayOfWeek = simple.getDay();
    const ISOweekStart = new Date(simple);
    if (dayOfWeek <= 4) {
        ISOweekStart.setDate(simple.getDate() - simple.getDay() + 1);
    } else {
        ISOweekStart.setDate(simple.getDate() + 8 - simple.getDay());
    }
    return ISOweekStart;
}
/* ===== 工具函數：日期格式化 ===== */
function formatDate(date) {
    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, '0');
    const d = String(date.getDate()).padStart(2, '0');
    return y + '/' + m + '/' + d;
}

/* ===== 主應用邏輯 ===== */
const app = {
    rowsWrap: null,
    mainStatsEl: null,
    toastEl: null,
    groupData: [],
    _confirmCallback: null,
    init() {
        this.rowsWrap = document.getElementById('rowsWrap');
        this.mainStatsEl = document.getElementById('mainStats');
        this.toastEl = document.getElementById('toast');
        document.getElementById('btnPdaToggle').addEventListener('click', function() { app.togglePdaBox(); });
        document.getElementById('btnPdaUndo').addEventListener('click', function() { app.pdaScanUndo(); });
        document.getElementById('btnPdaParse').addEventListener('click', function() { app.confirmPdaParse(); });
        document.getElementById('btnManualToggle').addEventListener('click', function() { app.toggleManualBox(); });
        document.getElementById('btnAddRow').addEventListener('click', function() { app.addRow(); });
        document.getElementById('btnBatchAll').addEventListener('click', function() { app.batchSubmitAll(); });
        document.getElementById('btnDelRow1').addEventListener('click', function() { app.delRow(this); });
        document.getElementById('btnSpace1').addEventListener('click', function() { app.insertSpace(this); });
        document.getElementById('btnSubmit1').addEventListener('click', function() { app.submitData(this); });
        document.getElementById('btnClearAll').addEventListener('click', function() { app.clearAll(); });
        document.getElementById('btnCopy').addEventListener('click', function() { app.copyResult(); });
        document.getElementById('btnPrint').addEventListener('click', function() { app.printData(); });
        document.getElementById('btnCopyFull').addEventListener('click', function() { app.copyFullResult(); });
        document.getElementById('btnToggleImport').addEventListener('click', function() { app.toggleImportBox(); });
        document.getElementById('btnLoadImport').addEventListener('click', function() { app.loadImportData(); });
        document.getElementById('confirmCancelBtn').addEventListener('click', function() { app.onConfirmCancel(); });
        document.getElementById('confirmOkBtn').addEventListener('click', function() { app.onConfirmOk(); });
        document.getElementById('pdaScanText').addEventListener('input', function() { app.pdaScanCountUpdate(); });
        document.getElementById('confirmOverlay').addEventListener('click', function(e) { if (e.target === this) { app.hideConfirmModal(); } });
        document.addEventListener('keydown', function(e) { if (e.key === 'Enter') { const lastBtn = document.querySelector('.input-row:last-child .btn-submit'); if (lastBtn) { lastBtn.click(); } } });
        this.pdaScanCountUpdate(); // 初始化状态提示隐藏
        this.calcAll();
    },
    togglePdaBox() {
        const box = document.getElementById('pdaBox');
        const btn = document.getElementById('btnPdaToggle');
        if (box.style.display === 'flex') { box.style.display = 'none'; btn.textContent = '▼ PDA掃碼工具'; } else { box.style.display = 'flex'; btn.textContent = '▲ PDA掃碼工具'; }
    },
    toggleManualBox() {
        const box = document.getElementById('manualBox');
        const btn = document.getElementById('btnManualToggle');
        if (box.style.display === 'block') { box.style.display = 'none'; btn.textContent = '▼ 手動輸入工具'; } else { box.style.display = 'block'; btn.textContent = '▲ 手動輸入工具'; }
    },
    insertSpace(btn) {
        const row = btn.closest('.input-row');
        const qtyInput = row.querySelector('.qtyInput');
        const start = qtyInput.selectionStart;
        const end = qtyInput.selectionEnd;
        const value = qtyInput.value;
        qtyInput.value = value.substring(0, start) + ' ' + value.substring(end);
        qtyInput.selectionStart = qtyInput.selectionEnd = start + 1;
        qtyInput.focus();
    },
    parseQtyList(val) {
        const numArr = val.trim().split(/\s+/).map(function(n) { return parseInt(n) || 0; }).filter(function(n) { return n > 0; });
        return numArr;
    },
    addRow() {
        const row = document.createElement('div');
        row.className = 'input-row';
        row.innerHTML = '<button class="btn-del-row">×</button>' +
            '<input type="text" class="stackInput" placeholder="棧號">' +
            '<input type="text" class="partInput" placeholder="料號">' +
            '<input type="text" inputmode="numeric" class="traceInput" placeholder="TRACE ID">' +
            '<input type="text" inputmode="numeric" class="qtyInput" placeholder="片數(多數值按空白鍵分隔，每個數字=1箱)">' +
            '<input type="tel" class="boxInput" placeholder="箱數（預設1，多數值時自動忽略）">' +
            '<div class="row-btn-group">' +
            '<button class="btn-space">空白</button>' +
            '<button class="btn-submit">送出本筆</button>' +
            '</div>';
        row.querySelector('.btn-del-row').addEventListener('click', function() { app.delRow(this); });
        row.querySelector('.btn-space').addEventListener('click', function() { app.insertSpace(this); });
        row.querySelector('.btn-submit').addEventListener('click', function() { app.submitData(this); });
        this.rowsWrap.appendChild(row);
    },
    delRow(btn) {
        const allRows = this.rowsWrap.querySelectorAll('.input-row');
        if (allRows.length <= 1) { this.showToast('至少保留一組輸入欄位'); return; }
        btn.closest('.input-row').remove();
    },
    submitData(btn) {
        const row = btn.closest('.input-row');
        const stackEl = row.querySelector('.stackInput');
        const partEl = row.querySelector('.partInput');
        const traceEl = row.querySelector('.traceInput');
        const qtyEl = row.querySelector('.qtyInput');
        const boxEl = row.querySelector('.boxInput');
        const stack = stackEl.value.trim();
        const part = partEl.value.trim();
        const trace = traceEl.value.trim();
        const qtyList = this.parseQtyList(qtyEl.value);
        const boxCount = parseInt(boxEl.value) || 1;
        if (qtyList.length === 0) { this.showToast('請輸入有效片數'); return; }
        const groupKey = stack + '|' + part;
        let targetGroup = this.groupData.find(function(g) { return g.key === groupKey; });
        if (!targetGroup) {
            targetGroup = { key: groupKey, stack: stack, part: part, totalQty: 0, totalBox: 0, qtyBoxMap: {}, traceMap: {} };
            this.groupData.push(targetGroup);
        }
        let inputPcArr = [];
        if (qtyList.length === 1) {
            const qty = qtyList[0];
            for (let i = 0; i < boxCount; i++) { inputPcArr.push(qty); targetGroup.totalQty += qty; targetGroup.totalBox += 1; targetGroup.qtyBoxMap[qty] = (targetGroup.qtyBoxMap[qty] || 0) + 1; }
        } else {
            qtyList.forEach(function(qty) { inputPcArr.push(qty); targetGroup.totalQty += qty; targetGroup.totalBox += 1; targetGroup.qtyBoxMap[qty] = (targetGroup.qtyBoxMap[qty] || 0) + 1; });
        }
        if (trace) {
            if (!targetGroup.traceMap[trace]) { targetGroup.traceMap[trace] = { totalPc: 0, boxNum: 0, pcList: [] }; }
            const traceItem = targetGroup.traceMap[trace];
            traceItem.totalPc += inputPcArr.reduce(function(a, b) { return a + b; }, 0);
            traceItem.boxNum += inputPcArr.length;
            traceItem.pcList = traceItem.pcList.concat(inputPcArr);
        }
        stackEl.value = ''; partEl.value = ''; traceEl.value = ''; qtyEl.value = ''; boxEl.value = '';
        stackEl.focus();
        this.calcAll();
    },
    batchSubmitAll() {
        const allRows = this.rowsWrap.querySelectorAll('.input-row');
        let hasValid = false;
        allRows.forEach(function(row) {
            const stackEl = row.querySelector('.stackInput');
            const partEl = row.querySelector('.partInput');
            const traceEl = row.querySelector('.traceInput');
            const qtyEl = row.querySelector('.qtyInput');
            const boxEl = row.querySelector('.boxInput');
            const stack = stackEl.value.trim();
            const part = partEl.value.trim();
            const trace = traceEl.value.trim();
            const qtyList = app.parseQtyList(qtyEl.value);
            const boxCount = parseInt(boxEl.value) || 1;
            if (qtyList.length === 0) return;
            hasValid = true;
            const groupKey = stack + '|' + part;
            let targetGroup = app.groupData.find(function(g) { return g.key === groupKey; });
            if (!targetGroup) {
                targetGroup = { key: groupKey, stack: stack, part: part, totalQty: 0, totalBox: 0, qtyBoxMap: {}, traceMap: {} };
                app.groupData.push(targetGroup);
            }
            let inputPcArr = [];
            if (qtyList.length === 1) {
                const qty = qtyList[0];
                for (let i = 0; i < boxCount; i++) { inputPcArr.push(qty); targetGroup.totalQty += qty; targetGroup.totalBox += 1; targetGroup.qtyBoxMap[qty] = (targetGroup.qtyBoxMap[qty] || 0) + 1; }
            } else {
                qtyList.forEach(function(qty) { inputPcArr.push(qty); targetGroup.totalQty += qty; targetGroup.totalBox += 1; targetGroup.qtyBoxMap[qty] = (targetGroup.qtyBoxMap[qty] || 0) + 1; });
            }
            if (trace) {
                if (!targetGroup.traceMap[trace]) { targetGroup.traceMap[trace] = { totalPc: 0, boxNum: 0, pcList: [] }; }
                const traceItem = targetGroup.traceMap[trace];
                traceItem.totalPc += inputPcArr.reduce(function(a, b) { return a + b; }, 0);
                traceItem.boxNum += inputPcArr.length;
                traceItem.pcList = traceItem.pcList.concat(inputPcArr);
            }
            stackEl.value = ''; partEl.value = ''; traceEl.value = ''; qtyEl.value = ''; boxEl.value = '';
        });
        if (!hasValid) { this.showToast('未偵測到有效資料'); return; }
        this.showToast('所有列送出成功');
        this.calcAll();
    },
    clearAll() {
        this.showConfirmModal({ icon: '🗑️', title: '重置確認', msg: '確定要清空所有資料嗎？\n此操作無法撤銷。', confirmText: '重置', confirmClass: 'confirm-danger', onConfirm: function() { app.clearAllInternal(); } });
    },
    clearAllInternal() {
        this.groupData = [];
        this.rowsWrap.innerHTML = '<div class="input-row">' +
            '<button class="btn-del-row">×</button>' +
            '<input type="text" class="stackInput" placeholder="棧號">' +
            '<input type="text" class="partInput" placeholder="料號">' +
            '<input type="text" inputmode="numeric" class="traceInput" placeholder="TRACE ID">' +
            '<input type="text" inputmode="numeric" class="qtyInput" placeholder="片數(多數值按空白鍵分隔，每個數字=1箱)">' +
            '<input type="tel" class="boxInput" placeholder="箱數（預設1，多數值時自動忽略）">' +
            '<div class="row-btn-group">' +
            '<button class="btn-space">空白</button>' +
            '<button class="btn-submit">送出本筆</button>' +
            '</div>' +
            '</div>';
        const firstRow = this.rowsWrap.querySelector('.input-row');
        firstRow.querySelector('.btn-del-row').addEventListener('click', function() { app.delRow(this); });
        firstRow.querySelector('.btn-space').addEventListener('click', function() { app.insertSpace(this); });
        firstRow.querySelector('.btn-submit').addEventListener('click', function() { app.submitData(this); });
        document.getElementById('pdaScanText').value = '';
        this.pdaScanCountUpdate();
        this.calcAll();
        this.showToast('已重置');
    },
    calcAll() { this.renderMainStats(); this.renderPrintTable(); },
    renderMainStats() {
        let html = '';
        if (this.groupData.length === 0) { html = '<div style="text-align:center;color:#6e7681;padding:20px 0;font-size:14px;">尚無統計資料，請先輸入或匯入資料</div>'; this.mainStatsEl.innerHTML = html; return; }
        this.groupData.forEach(function(group) {
            const calcParts = Object.entries(group.qtyBoxMap).map(function(e) { return e[0] + '×' + e[1]; }).join('+');
            html += '<div class="stat-group">' +
                '<div class="stat-line"><span>棧號</span><span>' + group.stack + '</span></div>' +
                '<div class="stat-line"><span>料號</span><span>' + group.part + '</span></div>' +
                '<div class="stat-line"><span>總箱數</span><span>' + group.totalBox + '</span></div>' +
                '<div class="stat-line"><span>總片數</span><span>' + group.totalQty + '</span></div>' +
                '<div class="calc-line"><span>計算方式</span><span>' + calcParts + '=<span class="calc-value">' + group.totalQty + '</span></span></div>';
            if (Object.keys(group.traceMap).length > 0) {
                html += '<div class="trace-sub-title">🔍 本組 TRACE ID</div>';
                Object.entries(group.traceMap).forEach(function(entry) {
                    const dc = entry[0]; const traceData = entry[1];
                    const cls = app.getTraceColor(dc);
                    const prodDate = app.getSingleDate(dc);
                    const diffDays = app.getTraceDiffDays(dc);
                    const sortedPcList = [].concat(traceData.pcList).sort(function(a, b) { return a - b; });
                    const pcStr = sortedPcList.join('/');
                    const headText = traceData.totalPc + '片（' + traceData.boxNum + '箱）DC：' + prodDate;
                    let printOnlyText = '';
                    if (diffDays > 30) { printOnlyText = '可使用(剩' + diffDays + '天)'; } else if (diffDays > 0) { printOnlyText = '即將過期(剩' + diffDays + '天)'; } else if (diffDays === 0) { printOnlyText = '今天到期'; } else { printOnlyText = '已過期(過期' + Math.abs(diffDays) + '天)'; }
                    html += '<div class="trace-wrap">' +
                        '<div class="trace-head">' +
                        '<span class="' + cls + '">' + dc + '</span>' +
                        '<span class="trace-head-text">' + headText + '</span>' +
                        '<span class="print-only"> — ' + printOnlyText + '</span>' +
                        '</div>' +
                        '<div class="trace-pc-list">' + pcStr + '</div>' +
                        '</div>';
                });
            }
            html += '</div>';
        });
        this.mainStatsEl.innerHTML = html;
    },
    renderPrintTable() {
        const tableEl = document.getElementById('printTable');
        if (this.groupData.length === 0) { tableEl.innerHTML = ''; return; }
        let html = '<thead><tr><th>棧號</th><th>料號</th><th>箱數</th><th>片數</th><th>計算方式</th><th>TRACE ID</th><th>DC/狀態</th><th>片數明細</th></tr></thead><tbody>';
        this.groupData.forEach(function(group) {
            const calcParts = Object.entries(group.qtyBoxMap).map(function(e) { return e[0] + '×' + e[1]; }).join('+');
            const traceKeys = Object.keys(group.traceMap);
            if (traceKeys.length === 0) {
                html += '<tr><td>' + group.stack + '</td><td>' + group.part + '</td><td>' + group.totalBox + '</td><td>' + group.totalQty + '</td><td>' + calcParts + '</td><td>-</td><td>-</td><td>-</td></tr>';
            } else {
                const rowSpan = traceKeys.length;
                traceKeys.forEach(function(dc, idx) {
                    const traceData = group.traceMap[dc];
                    const prodDate = app.getSingleDate(dc);
                    const diffDays = app.getTraceDiffDays(dc);
                    let statusText = '';
                    if (diffDays > 30) { statusText = '可使用(剩' + diffDays + '天)'; } else if (diffDays > 0) { statusText = '即將過期(剩' + diffDays + '天)'; } else if (diffDays === 0) { statusText = '今天到期'; } else { statusText = '已過期(過期' + Math.abs(diffDays) + '天)'; }
                    const sortedPcList = [].concat(traceData.pcList).sort(function(a, b) { return a - b; });
                    const pcStr = sortedPcList.join('/');
                    const detailStr = traceData.totalPc + '片(' + traceData.boxNum + '箱) ' + pcStr;
                    html += '<tr>';
                    if (idx === 0) { html += '<td rowspan="' + rowSpan + '">' + group.stack + '</td><td rowspan="' + rowSpan + '">' + group.part + '</td><td rowspan="' + rowSpan + '">' + group.totalBox + '</td><td rowspan="' + rowSpan + '">' + group.totalQty + '</td><td rowspan="' + rowSpan + '">' + calcParts + '</td>'; }
                    html += '<td>' + dc + '</td><td>' + prodDate + ' ' + statusText + '</td><td>' + detailStr + '</td></tr>';
                });
            }
        });
        html += '</tbody>';
        tableEl.innerHTML = html;
    },
    getTraceColor(traceId) { const diffDay = this.getTraceDiffDays(traceId); if (diffDay < 0) { return 'trace-expired'; } else if (diffDay <= 30) { return 'trace-warning'; } else { return 'trace-good'; } },
    getTraceDiffDays(traceId) { try { const id = String(traceId); const year = 2000 + parseInt(id.substring(0, 2)); const week = parseInt(id.substring(2, 4)); const expireStart = getISOWeekDates(year + 1, week); const today = new Date(); const diffDay = Math.floor((expireStart - today) / (1000 * 60 * 60 * 24)); return diffDay; } catch (e) { console.error('getTraceDiffDays error:', e, traceId); return 999; } },
    getSingleDate(traceId) { try { const id = String(traceId); const year = 2000 + parseInt(id.substring(0, 2)); const week = parseInt(id.substring(2, 4)); const startDate = getISOWeekDates(year, week); return formatDate(startDate); } catch (e) { console.error('getSingleDate error:', e, traceId); return '未知'; } },
    copyResult() {
        if (this.groupData.length === 0) { this.showToast('尚無資料可複製'); return; }
        let copyLines = [];
        this.groupData.forEach(function(group) {
            const calcFormula = Object.entries(group.qtyBoxMap).map(function(e) { return e[0] + '×' + e[1]; }).join('+');
            const traceList = Object.keys(group.traceMap);
            const dataCodeStr = Object.entries(group.traceMap).map(function(e) { return e[0] + '*' + e[1].totalPc; }).join('/');
            let minTrace = traceList[0] || ''; traceList.forEach(function(t) { if (Number(t) < Number(minTrace)) minTrace = t; });
            const dateStr = minTrace ? app.getSingleDate(minTrace) : '';
            const line = group.stack + ',' + group.part + ',' + calcFormula + ',' + group.totalQty + ',' + group.totalBox + ',' + dataCodeStr + ',' + dateStr;
            copyLines.push(line);
        });
        const resultStr = copyLines.join('\n');
        if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(resultStr).then(function() { app.showToast('複製成功！'); }).catch(function() { app.fallbackCopy(resultStr); }); } else { this.fallbackCopy(resultStr); }
    },
    fallbackCopy(text) { const textarea = document.createElement('textarea'); textarea.value = text; textarea.style.position = 'fixed'; textarea.style.left = '-9999px'; document.body.appendChild(textarea); textarea.select(); try { document.execCommand('copy'); this.showToast('複製成功！'); } catch (e) { console.error('fallbackCopy error:', e); this.showToast('複製失敗，請手動複製'); } document.body.removeChild(textarea); },
    copyFullResult() {
        if (this.groupData.length === 0) { this.showToast('尚無資料可複製'); return; }
        const jsonStr = JSON.stringify(this.groupData, null, 2);
        if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(jsonStr).then(function() { app.showToast('完整規格資料已複製，可在下方匯入框還原全部明細'); }).catch(function() { app.fallbackCopy(jsonStr); }); } else { this.fallbackCopy(jsonStr); }
    },
    printData() { window.print(); },
    showToast(msg) { this.toastEl.textContent = msg; this.toastEl.style.display = 'block'; setTimeout(function() { app.toastEl.style.display = 'none'; }, 1800); },
    toggleImportBox() { const box = document.getElementById('importBox'); box.style.display = box.style.display === 'flex' ? 'none' : 'flex'; },
    loadImportData() {
        const text = document.getElementById('importTextarea').value.trim();
        if (!text) { this.showToast('請貼入資料'); return; }
        if (text.trim().startsWith('[')) { try { const restore = JSON.parse(text); if (Array.isArray(restore)) { this.groupData = restore; this.calcAll(); this.showToast('完整資料匯入成功，所有箱數、箱片序列已還原'); return; } } catch (e) { console.error('JSON parse error:', e); } }
        const lines = text.split('\n').filter(function(line) { return line.trim() !== ''; });
        const newGroupData = [];
        for (let i = 0; i < lines.length; i++) {
            const line = lines[i]; const cols = line.split(',');
            if (cols.length < 7) { this.showToast('格式錯誤，行：' + line.substring(0, 30)); return; }
            const stack = cols[0]; const part = cols[1]; const calcStr = cols[2]; const totalQty = cols[3]; const totalBox = cols[4]; const traceCombine = cols[5];
            const traceItems = traceCombine.split('/').map(function(item) { const parts = item.split('*'); return { dc: parts[0].trim(), totalPc: Number(parts[1]) || 0 }; });
            const traceMap = {}; traceItems.forEach(function(t) { traceMap[t.dc] = { totalPc: t.totalPc, boxNum: 0, pcList: [] }; });
            const qtyBoxMap = {}; const calcParts = calcStr.split('+'); calcParts.forEach(function(part) { const match = part.match(/^(\d+)×(\d+)$/); if (match) { const q = match[1]; const cnt = Number(match[2]); qtyBoxMap[q] = cnt; } });
            newGroupData.push({ key: stack.trim() + '|' + part.trim(), stack: stack.trim(), part: part.trim(), totalQty: Number(totalQty) || 0, totalBox: Number(totalBox) || 0, qtyBoxMap: qtyBoxMap, traceMap: traceMap });
        }
        this.groupData = newGroupData; this.calcAll(); this.showToast('彙總資料匯入完成（明細數據無法還原）');
    },
    showConfirmModal(options) { const overlay = document.getElementById('confirmOverlay'); document.getElementById('confirmIcon').textContent = options.icon || '⚠️'; document.getElementById('confirmTitle').textContent = options.title || '確認'; document.getElementById('confirmMsg').textContent = options.msg || '確定要執行此操作嗎？'; const okBtn = document.getElementById('confirmOkBtn'); okBtn.textContent = options.confirmText || '確認'; okBtn.className = 'confirm-ok'; if (options.confirmClass) okBtn.classList.add(options.confirmClass); this._confirmCallback = options.onConfirm || null; overlay.style.display = 'flex'; },
    hideConfirmModal() { document.getElementById('confirmOverlay').style.display = 'none'; this._confirmCallback = null; },
    onConfirmOk() { if (this._confirmCallback) { this._confirmCallback(); } this.hideConfirmModal(); },
    onConfirmCancel() { this.hideConfirmModal(); },

    /* ===== 修正後的PDA解析邏輯 ===== */
    pdaParseLine(raw) {
        try {
            const arr = raw.split('|');
            if (arr.length < 4) return null;
            let part = arr[0].trim();
            const traceFull = arr[1].trim();
            const qtyStr = arr[2].trim();
            const serialNo = arr.length === 5 ? arr[3].trim() : '無';
            // 片数验证：必须为正整数
            const qty = parseInt(qtyStr, 10);
            if (isNaN(qty) || qty <= 0) return null;
            // 料号处理：移除末尾流水号（最后一个 - 后的纯数字区段）
            const lastDash = part.lastIndexOf('-');
            if (lastDash !== -1) {
                const afterDash = part.substring(lastDash + 1);
                if (/^\d+$/.test(afterDash)) {
                    part = part.substring(0, lastDash);
                }
            }
            // Trace ID 解析：支持纯4位数字 或 数字-4位数字
            let traceId = null;
            const trimmedTrace = traceFull;
            if (/^\d{4}$/.test(trimmedTrace)) {
                traceId = trimmedTrace;
            } else {
                const dashIdx = trimmedTrace.lastIndexOf('-');
                if (dashIdx !== -1) {
                    const afterDash = trimmedTrace.substring(dashIdx + 1);
                    if (/^\d{4}$/.test(afterDash)) {
                        traceId = afterDash;
                    }
                }
            }
            if (!traceId) return null; // trace无效
            return { part: part, qty: qty, traceId: traceId, serialNo: serialNo };
        } catch (e) {
            console.error('pdaParseLine error:', e, raw);
            return null;
        }
    },

    pdaScanCountUpdate() {
        const scanText = document.getElementById('pdaScanText').value;
        const lines = scanText.split('\n').filter(function(line) { return line.trim() !== ''; });
        const countEl = document.getElementById('pdaScanCount');
        const dupInfoEl = document.getElementById('pdaDupInfo');
        const invalidInfoEl = document.getElementById('pdaInvalidInfo');
        const statusEl = document.getElementById('pdaStatusMsg');

        let validCount = 0;
        let invalidCount = 0;
        const rawLines = [];
        lines.forEach(function(line) {
            const trimmed = line.trim();
            if (!trimmed) return;
            const parsed = app.pdaParseLine(trimmed);
            if (parsed && parsed.traceId) {
                validCount++;
                rawLines.push(trimmed);
            } else {
                invalidCount++;
            }
        });
        countEl.textContent = validCount;

        // 重复笔数统计
        let dupCount = 0;
        const seenLines = {};
        rawLines.forEach(function(raw) {
            if (seenLines[raw]) dupCount++;
            else seenLines[raw] = true;
        });
        dupInfoEl.innerHTML = dupCount > 0 ? '<span class="pda-dup-full">⚠️ ' + dupCount + '筆完全重複</span>' : '';

        // 非规格跳过显示（无效笔数，含格式错误）
        invalidInfoEl.innerHTML = invalidCount > 0 ? '<span class="pda-dup-full" style="color:#f97316;">🚫 非規格/跳過 ' + invalidCount + ' 筆</span>' : '';

        // 更新批次状态提示（正确/注意）
        if (validCount > 0 && invalidCount === 0) {
            statusEl.textContent = '✅ 格式正确';
            statusEl.className = 'pda-dup-info status-valid';
            statusEl.style.display = 'inline-flex';
        } else if (invalidCount > 0) {
            statusEl.textContent = '⚠️ 注意：部分條碼格式有誤，請檢查';
            statusEl.className = 'pda-dup-info status-invalid';
            statusEl.style.display = 'inline-flex';
        } else {
            statusEl.textContent = '';
            statusEl.style.display = 'none';
        }
    },

    pdaScanUndo() {
        const textarea = document.getElementById('pdaScanText');
        const value = textarea.value;
        if (!value.trim()) { this.showToast('沒有可撤銷的掃描資料'); return; }
        const lines = value.split('\n');
        let lastNonEmptyIndex = -1;
        for (let i = lines.length - 1; i >= 0; i--) { if (lines[i].trim() !== '') { lastNonEmptyIndex = i; break; } }
        if (lastNonEmptyIndex === -1) { this.showToast('沒有可撤銷的掃描資料'); return; }
        const deletedLine = lines[lastNonEmptyIndex].trim();
        lines.splice(lastNonEmptyIndex, 1);
        textarea.value = lines.join('\n');
        this.pdaScanCountUpdate();
        const preview = deletedLine.substring(0, 30);
        this.showToast('已撤銷最後一筆：' + preview + (deletedLine.length > 30 ? '...' : ''));
    },

    confirmPdaParse() {
        const stackVal = document.getElementById('pdaStack').value.trim();
        const scanText = document.getElementById('pdaScanText').value.trim();
        if (!stackVal) { this.showToast('請先填寫棧號'); return; }
        if (!scanText) { this.showToast('請貼上PDA掃描條碼'); return; }
        const lines = scanText.split('\n').filter(function(line) { return line.trim() !== ''; });
        let validCount = 0, dupCount = 0, invalidCount = 0;
        const seenRawLines = {};
        lines.forEach(function(line) {
            const trimmed = line.trim();
            if (!trimmed) return;
            const parsed = app.pdaParseLine(trimmed);
            if (parsed && parsed.traceId) {
                validCount++;
                if (seenRawLines[trimmed]) dupCount++;
                else seenRawLines[trimmed] = true;
            } else {
                invalidCount++;
            }
        });
        if (validCount === 0) { this.showToast('無有效掃描資料，檢查格式'); return; }
        let msg = '確定要解析 ' + validCount + ' 筆有效掃描資料並匯入統計嗎？\n匯入後將在整體統計結果中顯示。';
        if (dupCount > 0) msg += '\n⚠️ 有 ' + dupCount + ' 筆完全重複將被跳過。';
        if (invalidCount > 0) msg += '\n🚫 有 ' + invalidCount + ' 筆非規格格式已排除。';
        this.showConfirmModal({ icon: '📊', title: '解析並匯入統計', msg: msg, confirmText: '匯入', confirmClass: 'confirm-teal', onConfirm: function() { app.pdaParseAndImport(); } });
    },

    pdaParseAndImport() {
        const stackVal = document.getElementById('pdaStack').value.trim();
        const scanText = document.getElementById('pdaScanText').value.trim();
        if (!stackVal) { this.showToast('請先填寫棧號'); return; }
        if (!scanText) { this.showToast('請貼上PDA掃描條碼'); return; }
        const lines = scanText.split('\n').filter(function(line) { return line.trim() !== ''; });
        let successCnt = 0, dupSkipCnt = 0, invalidCnt = 0;
        const batchSeenRawLines = {};
        lines.forEach(function(line) {
            const raw = line.trim();
            const parsed = app.pdaParseLine(raw);
            if (!parsed) { invalidCnt++; return; }
            if (batchSeenRawLines[raw]) { dupSkipCnt++; return; }
            batchSeenRawLines[raw] = true;
            const part = parsed.part;
            const traceId = parsed.traceId;
            const qty = parsed.qty;
            const groupKey = stackVal + '|' + part;
            let targetGroup = app.groupData.find(function(g) { return g.key === groupKey; });
            if (!targetGroup) {
                targetGroup = { key: groupKey, stack: stackVal, part: part, totalQty: 0, totalBox: 0, qtyBoxMap: {}, traceMap: {} };
                app.groupData.push(targetGroup);
            }
            targetGroup.totalQty += qty;
            targetGroup.totalBox += 1;
            targetGroup.qtyBoxMap[qty] = (targetGroup.qtyBoxMap[qty] || 0) + 1;
            if (!targetGroup.traceMap[traceId]) { targetGroup.traceMap[traceId] = { totalPc: 0, boxNum: 0, pcList: [] }; }
            const traceItem = targetGroup.traceMap[traceId];
            traceItem.totalPc += qty;
            traceItem.boxNum += 1;
            traceItem.pcList.push(qty);
            successCnt++;
        });
        if (successCnt === 0 && dupSkipCnt === 0) { this.showToast('無有效掃描資料，檢查格式'); return; }
        let msg = '解析完成，匯入' + successCnt + '筆掃描資料';
        if (dupSkipCnt > 0) msg += '，' + dupSkipCnt + '筆完全重複已跳過';
        if (invalidCnt > 0) msg += '，' + invalidCnt + '筆非規格格式已排除';
        this.showToast(msg);
        document.getElementById('pdaScanText').value = '';
        this.pdaScanCountUpdate();
        this.calcAll();
    }
};

document.addEventListener('DOMContentLoaded', function() {
    try { app.init(); } catch (e) { console.error('App init error:', e); }
});
setTimeout(function() {
    try { if (!app.rowsWrap) { app.init(); } } catch (e) { console.error('App timeout init error:', e); }
}, 500);
</script>
